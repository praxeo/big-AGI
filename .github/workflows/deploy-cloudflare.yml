# Deploy big-AGI to Cloudflare Workers (via the OpenNext adapter).
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   - CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   - CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Provider API keys are NOT set here - they are Worker secrets:  wrangler secret put OPENAI_API_KEY  (etc.)
# See docs/deploy-cloudflare.md.
#
# Until the two secrets above exist, the deploy step fails with an auth error (the build steps still pass).

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - v2-dev        # deploy on merge to the default branch (this repo's main line)
  workflow_dispatch:  # ...or trigger a deploy manually from the Actions tab

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Worker bundle
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
